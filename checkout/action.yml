name: 'Checkout Source'
description: 'Checkout R source from the git-svn mirror'

runs:
  using: "composite"
  steps:
    - name: Prepare git
      run: |
        git config --global core.autocrlf false
        git config --global --add safe.directory $PWD || true
      shell: bash

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 100

    - name: Prepare source
      run: |
        $GITHUB_ACTION_PATH/git-svn-info.sh > SVNINFO
        tools/fetch-recommended
      shell: bash

    - name: Fix svn-info for Windows
      if: runner.os == 'windows'
      run: sed -i.bak "s|GIT =.*|GIT = $(cygpath -u $GITHUB_ACTION_PATH)/git-svn-info.sh|" src/include/Makefile.win
      shell: bash
