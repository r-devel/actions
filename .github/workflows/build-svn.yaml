on:
  workflow_call:

name: Build from SVN

permissions:
  contents: write

env:
  R_CRAN_WEB: "https://cran.rstudio.com"
  CRAN_MIRROR: "cran.rstudio.com"

jobs:
  windows:
    name: Windows
    runs-on: ${{matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-latest'}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'x86_64', 'aarch64']
    steps:
    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Setup Build Tooling
      uses: r-devel/actions/setup-windows-tools@main

    - name: Build R-base
      uses: r-devel/actions/build-r-windows@main

    - name: Test Installer
      run: |
        Get-Item "src/gnuwin32/installer/R-*-win.exe" | Rename-Item -NewName { $_.Name -replace 'win\.exe$', '${{matrix.arch }}.exe' }
        .\src\gnuwin32\installer\R-*.exe /SILENT
      shell: powershell

    - name: Save installer
      uses: actions/upload-artifact@v7
      with:
        name: Win-installer-${{matrix.arch}}
        path: src/gnuwin32/installer/R-*.exe

    - name: Run checks
      run: |
        cd src/gnuwin32
        export TAR="/usr/bin/tar"
        export TAR_OPTIONS="--force-local"
        export PATH="/c/rtools-base-toolchain/bin:/c/Users/$USER/AppData/Roaming/TinyTeX/bin/windows:$PATH"
        make check-all
      shell: msys2 {0}

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail

  linux:
    name: Linux
    runs-on: ubuntu-26.04${{matrix.ARCH == 'arm' && '-arm' || ''}}
    container:
      image: ${{matrix.OS}}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        CC: [ gcc, clang ]
        OS: [ 'debian:stable', 'debian:testing' ]
        ARCH: [ 'intel', 'arm']
    steps:
    - name: System dependencies
      run: |
        set -e
        apt-get update -y
        apt-get install -y ${{matrix.CC}} curl locales git rsync gfortran xvfb autoconf pkg-config texinfo texlive-latex-extra texlive-fonts-recommended tk8.6-dev dpkg-dev \
        libcurl4-openssl-dev libblas-dev libbz2-dev libicu-dev libjpeg-dev liblapack-dev liblzma-dev libncurses5-dev libpcre2-dev libpng-dev libtiff-dev libcairo2-dev libpango1.0-dev libreadline-dev libxt-dev
        localedef -i en_US -f UTF-8 en_US.UTF-8
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV

    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Configure
      run: CC=${{matrix.CC}} ./configure --enable-R-shlib --with-blas --with-lapack --disable-java

    - name: Build R
      run: make

    - name: Run checks
      run: xvfb-run make check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true

  bsd:
    name: ${{matrix.name}}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: FreeBSD
          os: freebsd
          release: "15"
          packages: >-
            bash curl gmake pkgconf gcc perl5 rsync texinfo texlive-base texlive-texmf tex-formats tex-dvipsk xorg-vfbserver
            pcre2 icu readline png jpeg-turbo tiff cairo pango libXt libXmu tcl86 tk86 openblas
          configure: >-
            --with-blas=-lopenblas --with-lapack FC=gfortran
            --with-tcl-config=/usr/local/lib/tcl8.6/tclConfig.sh --with-tk-config=/usr/local/lib/tk8.6/tkConfig.sh
        - name: OpenBSD
          os: openbsd
          release: "8"
          # Xvfb and X11 libraries are part of the base system. Base tar cannot
          # detect compression, so R needs gtar (like the OpenBSD R port)
          packages: >-
            bash curl gmake gfortran gtar-- texinfo texlive_texmf-full
            pcre2 icu4c png jpeg tiff cairo pango tcl%8.6 tk%8.6
          configure: >-
            FC=egfortran TEXI2ANY=/usr/local/bin/gtexi2any
            --with-tcl-config=/usr/local/lib/tcl/tcl8.6/tclConfig.sh --with-tk-config=/usr/local/lib/tcl/tk8.6/tkConfig.sh
    defaults:
      run:
        shell: ${{matrix.os}} {0}
    env:
      LANG: en_US.UTF-8
      # The VM has no /etc/localtime so R cannot infer a time zone
      TZ: UTC
      DISPLAY: ':99'
    steps:
    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Start FreeBSD VM
      if: matrix.os == 'freebsd'
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{matrix.release}}
        sync: rsync
        copyback: false
        envs: 'LANG TZ DISPLAY'
        prepare: pkg install -y ${{matrix.packages}}

    - name: Start OpenBSD VM
      if: matrix.os == 'openbsd'
      uses: vmactions/openbsd-vm@v1
      with:
        release: ${{matrix.release}}
        sync: rsync
        copyback: false
        envs: 'LANG TZ DISPLAY'
        prepare: pkg_add -I ${{matrix.packages}}

    - name: Configure
      run: |
        ./configure --enable-R-shlib --disable-java MAKE=gmake \
          CPPFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib ${{matrix.configure}}

    - name: Build R
      run: gmake

    # Detach Xvfb from the ssh session, otherwise the step never finishes
    - name: Start Xvfb
      run: nohup Xvfb $DISPLAY </dev/null >/dev/null 2>&1 &

    - name: Run checks
      timeout-minutes: 90
      run: gmake check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true

  macos:
    name: MacOS
    strategy:
      fail-fast: false
      matrix:
        OS: [ 'macOS-26', 'macOS-26-intel' ]
    runs-on: ${{matrix.OS}}
    timeout-minutes: 120
    env:
      R_TEXI2DVICMD: emulation
    steps:
    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Setup Build Tooling
      uses: r-devel/actions/setup-macos-tools@main

    - name: Configure
      run: |
        export CC=clang
        export CPPFLAGS="-I/opt/R/$(uname -m)/include"
        export LDFLAGS="-L/opt/R/$(uname -m)/lib"
        export PKG_CONFIG_PATH="/opt/R/$(uname -m)/lib/pkgconfig:/opt/R/$(uname -m)/share/pkgconfig"
        if [ "$(uname -m)" = "arm64" ]; then
          ACCELERATE="--with-lapack --with-blas"
        fi
        ./configure --prefix=/opt/R/$(uname -m)/r-devel --disable-java --with-cairo --without-tcltk --without-x --with-aqua $ACCELERATE --enable-R-shlib SED=/usr/bin/sed

    - name: Build R
      run: make

    - name: Run checks
      run: make check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true
