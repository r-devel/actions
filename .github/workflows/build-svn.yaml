on:
  workflow_call:

name: Build from SVN

permissions:
  contents: write

env:
  R_CRAN_WEB: "https://cran.rstudio.com"
  CRAN_MIRROR: "cran.rstudio.com"

jobs:
  windows:
    name: Windows
    runs-on: ${{matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-latest'}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'x86_64', 'aarch64']
    steps:
    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Setup Build Tooling
      uses: r-devel/actions/setup-windows-tools@main

    - name: Build R-base
      uses: r-devel/actions/build-r-windows@main

    - name: Test Installer
      run: |
        Get-Item "src/gnuwin32/installer/R-*-win.exe" | Rename-Item -NewName { $_.Name -replace 'win\.exe$', '${{matrix.arch }}.exe' }
        .\src\gnuwin32\installer\R-*.exe /SILENT
      shell: powershell

    - name: Save installer
      uses: actions/upload-artifact@v7
      with:
        name: Win-installer-${{matrix.arch}}
        path: src/gnuwin32/installer/R-*.exe

    - name: Run checks
      run: |
        cd src/gnuwin32
        export TAR="/usr/bin/tar"
        export TAR_OPTIONS="--force-local"
        export PATH="/c/rtools-base-toolchain/bin:/c/Users/$USER/AppData/Roaming/TinyTeX/bin/windows:$PATH"
        make check-all
      shell: msys2 {0}

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail

  linux:
    name: Linux
    runs-on: ubuntu-26.04${{matrix.ARCH == 'arm' && '-arm' || ''}}
    container:
      image: ${{matrix.OS}}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        CC: [ gcc, clang ]
        OS: [ 'debian:stable', 'debian:testing' ]
        ARCH: [ 'intel', 'arm']
    steps:
    - name: System dependencies
      run: |
        set -e
        apt-get update -y
        apt-get install -y ${{matrix.CC}} curl locales git rsync gfortran xvfb autoconf pkg-config texinfo texlive-latex-extra texlive-fonts-recommended tk8.6-dev dpkg-dev \
        libcurl4-openssl-dev libblas-dev libbz2-dev libicu-dev libjpeg-dev liblapack-dev liblzma-dev libncurses5-dev libpcre2-dev libpng-dev libtiff-dev libcairo2-dev libpango1.0-dev libreadline-dev libxt-dev
        localedef -i en_US -f UTF-8 en_US.UTF-8
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV

    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Configure
      run: CC=${{matrix.CC}} ./configure --enable-R-shlib --with-blas --with-lapack --disable-java

    - name: Build R
      run: make

    - name: Run checks
      run: xvfb-run make check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true

  alpine:
    name: Alpine
    runs-on: ubuntu-26.04${{matrix.ARCH == 'arm' && '-arm' || ''}}
    container:
      image: alpine:latest
    env:
      LANG: en_US.UTF-8
      # Containers have no /etc/localtime so R cannot infer a time zone
      TZ: UTC
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        ARCH: [ 'intel', 'arm']
    steps:
    - name: System dependencies
      shell: sh
      run: |
        apk add bash build-base gfortran perl git curl rsync xvfb-run pkgconf autoconf texinfo tzdata icu-data-full \
        texlive texmf-dist-latexextra texmf-dist-fontsrecommended font-dejavu \
        curl-dev readline-dev bzip2-dev xz-dev zstd-dev libdeflate-dev pcre2-dev icu-dev zlib-dev libpng-dev libjpeg-turbo-dev tiff-dev \
        cairo-dev pango-dev libxt-dev libxmu-dev tcl-dev tk-dev openblas-dev

    # JavaScript actions (i.e. actions/checkout) do not work in Alpine containers on ARM64
    - name: Checkout
      run: |
        git config --global --add safe.directory $PWD
        git init -q
        git remote add origin $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
        git fetch -q --depth 100 origin $GITHUB_SHA
        git checkout -q FETCH_HEAD
        echo "Revision: $(git log --grep="git-svn-id" -n1 | grep git-svn | cut -d'@' -f2 | cut -d' ' -f1)" | tee -a SVNINFO | tee -a SVN-REVISION
        echo "Last Changed Date: $(git log --grep="git-svn-id" -n1 --pretty=format:"%ad" --date=short)" | tee -a SVNINFO | tee -a SVN-REVISION
        tools/fetch-recommended

    - name: Configure
      run: ./configure --enable-R-shlib --with-blas=-lopenblas --with-lapack --disable-java

    - name: Build R
      run: make

    - name: Run checks
      run: xvfb-run make check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true

  macos:
    name: MacOS
    strategy:
      fail-fast: false
      matrix:
        OS: [ 'macOS-26', 'macOS-26-intel' ]
    runs-on: ${{matrix.OS}}
    timeout-minutes: 120
    env:
      R_TEXI2DVICMD: emulation
    steps:
    - name: Checkout
      uses: r-devel/actions/checkout@main

    - name: Setup Build Tooling
      uses: r-devel/actions/setup-macos-tools@main

    - name: Configure
      run: |
        export CC=clang
        export CPPFLAGS="-I/opt/R/$(uname -m)/include"
        export LDFLAGS="-L/opt/R/$(uname -m)/lib"
        export PKG_CONFIG_PATH="/opt/R/$(uname -m)/lib/pkgconfig:/opt/R/$(uname -m)/share/pkgconfig"
        if [ "$(uname -m)" = "arm64" ]; then
          ACCELERATE="--with-lapack --with-blas"
        fi
        ./configure --prefix=/opt/R/$(uname -m)/r-devel --disable-java --with-cairo --without-tcltk --without-x --with-aqua $ACCELERATE --enable-R-shlib SED=/usr/bin/sed

    - name: Build R
      run: make

    - name: Run checks
      run: make check-all

    - name: Print failed tests
      if: failure()
      run: tail -n100 tests/*.fail || true
